<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Swarvaah AI architecture, Sarvam models, and scale controls</title>
  <desc id="desc">The local Voice lab sends microphone audio to Sarvam Saaras v4 REST, reviews a transcript, uses optional Sarvam 105B Conversations for open dialogue, keeps business actions in a deterministic workflow, and speaks with Bulbul v3 Priya. The outbound phone path uses campaign controls, PostgreSQL outbox, a dial worker, Exotel, a public WebSocket media gateway, Pipecat, Saaras v3 Realtime, the same optional conversation layer, and Bulbul v3. Production scaling to 50,000 attempts per day is a target requiring provider capacity and load tests.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#1b2541}
      .eyebrow{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#4b60c2}
      .heading{font-size:40px;font-weight:800;letter-spacing:-1px}
      .sub{font-size:18px;fill:#67748e}
      .section{font-size:23px;font-weight:800}
      .label{font-size:14px;font-weight:800;letter-spacing:1.1px;fill:#5267c8}
      .boxhead{font-size:20px;font-weight:800}
      .boxbody{font-size:16px;fill:#68758e}
      .small{font-size:15px;fill:#697791}
      .chip{font-size:14px;font-weight:800;fill:#354ab2}
      .arrow{stroke:#8192d4;stroke-width:3;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8192d4"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#273a78" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1400" height="1100" rx="28" fill="#f7f9fe"/>
  <rect x="48" y="48" width="58" height="58" rx="16" fill="#263b79"/>
  <path d="M60 80 C69 64 77 96 87 80 C92 73 98 73 103 76" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="128" y="68" class="eyebrow">SWARVAAH AI / SYSTEM DESIGN</text>
  <text x="128" y="108" class="heading">From voice lab to high-volume calling</text>
  <text x="50" y="147" class="sub">Sarvam speech and optional free-text AI dialogue, with bounded reminder actions. The phone-scale path still needs a pilot.</text>

  <!-- Current local experience -->
  <rect x="48" y="178" width="1304" height="280" rx="22" fill="#fff" stroke="#e3e8f4" filter="url(#shadow)"/>
  <text x="78" y="218" class="section">01  Voice lab</text>
  <rect x="1120" y="193" width="202" height="31" rx="15" fill="#eef1ff"/>
  <text x="1146" y="214" class="chip">WORKING LOCALLY</text>
  <text x="78" y="247" class="small">Synthetic data · no phone call · browser speech recording and playback</text>
  <rect x="78" y="274" width="250" height="130" rx="14" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="98" y="311" class="label">OPERATOR BROWSER</text>
  <text x="98" y="341" class="boxhead">Voice lab UI</text>
  <text x="98" y="369" class="boxbody">Mic, transcript review,</text>
  <text x="98" y="389" class="boxbody">typed fallback</text>
  <path d="M329 339 H370" class="arrow"/>
  <rect x="376" y="274" width="250" height="130" rx="14" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="396" y="311" class="label">CONTROL API</text>
  <text x="396" y="341" class="boxhead">FastAPI</text>
  <text x="396" y="369" class="boxbody">In-memory audio; key</text>
  <text x="396" y="389" class="boxbody">stays server-side</text>
  <path d="M627 339 H668" class="arrow"/>
  <rect x="674" y="274" width="300" height="130" rx="14" fill="#eef1ff" stroke="#cbd5fa"/>
  <text x="694" y="311" class="label">SARVAM INPUT MODEL</text>
  <text x="694" y="341" class="boxhead">Saaras v4 REST</text>
  <text x="694" y="366" class="boxbody">microphone → transcript</text>
  <text x="694" y="390" class="boxbody">codemix mode</text>
  <path d="M975 339 H1016" class="arrow"/>
  <rect x="1022" y="274" width="300" height="130" rx="14" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="1042" y="311" class="label">DECISION + OUTPUT</text>
  <text x="1042" y="341" class="boxhead">Reminder workflow</text>
  <text x="1042" y="369" class="boxbody">105B chat + bounded action</text>
  <text x="1042" y="389" class="boxbody">Bulbul v3 · Priya audio</text>
  <text x="78" y="432" class="small">Optional Sarvam 105B Conversations answers free text. Only the workflow commits actions. Accepted text is saved; mic audio is not.</text>

  <!-- Phone path -->
  <rect x="48" y="479" width="1304" height="350" rx="22" fill="#fff" stroke="#e3e8f4" filter="url(#shadow)"/>
  <text x="78" y="519" class="section">02  Outbound phone path</text>
  <rect x="1104" y="494" width="218" height="31" rx="15" fill="#fff2e7"/>
  <text x="1125" y="515" class="chip" fill="#a8692e">PILOT NOT VERIFIED</text>
  <text x="78" y="549" class="small">Consent checks and campaign limits precede every attempted call; Exotel needs a public, India-hosted WSS gateway.</text>
  <rect x="78" y="577" width="220" height="95" rx="13" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="95" y="608" class="label">CONTROL PLANE</text>
  <text x="95" y="636" class="boxhead">Campaign + API</text>
  <text x="95" y="656" class="boxbody">consent · windows</text>
  <path d="M299 623 H327" class="arrow"/>
  <rect x="334" y="577" width="220" height="95" rx="13" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="351" y="608" class="label">DURABLE STATE</text>
  <text x="351" y="636" class="boxhead">PostgreSQL</text>
  <text x="351" y="656" class="boxbody">attempts · outbox</text>
  <path d="M555 623 H583" class="arrow"/>
  <rect x="590" y="577" width="220" height="95" rx="13" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="607" y="608" class="label">ADMISSION</text>
  <text x="607" y="636" class="boxhead">Dial workers</text>
  <text x="607" y="656" class="boxbody">Redis rate limit</text>
  <path d="M811 623 H839" class="arrow"/>
  <rect x="846" y="577" width="220" height="95" rx="13" fill="#f5f7fe" stroke="#dce3f6"/>
  <text x="863" y="608" class="label">PHONE NETWORK</text>
  <text x="863" y="636" class="boxhead">Exotel</text>
  <text x="863" y="656" class="boxbody">outbound + callbacks</text>
  <path d="M1067 623 H1095" class="arrow"/>
  <rect x="1102" y="577" width="220" height="95" rx="13" fill="#eef1ff" stroke="#cbd5fa"/>
  <text x="1119" y="608" class="label">LIVE AUDIO</text>
  <text x="1119" y="636" class="boxhead">WSS gateway</text>
  <text x="1119" y="656" class="boxbody">Pipecat · 8 kHz phone</text>
  <path d="M1212 673 V706" class="arrow"/>
  <rect x="78" y="715" width="1244" height="83" rx="13" fill="#eef1ff" stroke="#cbd5fa"/>
  <text x="100" y="748" class="label">LIVE PIPELINE INSIDE THE MEDIA GATEWAY</text>
  <text x="100" y="779" class="boxhead">Saaras v3 Realtime  →  105B chat + bounded actions  →  Bulbul v3 / Priya  →  Exotel playback</text>

  <!-- Scale path -->
  <rect x="48" y="850" width="1304" height="205" rx="22" fill="#fff" stroke="#e3e8f4" filter="url(#shadow)"/>
  <text x="78" y="890" class="section">03  Scale controls</text>
  <rect x="1011" y="865" width="311" height="31" rx="15" fill="#eef1ff"/>
  <text x="1034" y="886" class="chip">50,000 ATTEMPTS / DAY TARGET</text>
  <rect x="78" y="916" width="285" height="92" rx="13" fill="#f8f9fe" stroke="#e5e9f6"/>
  <text x="96" y="944" class="label">01  ADMIT</text>
  <text x="96" y="969" class="boxbody">Consent, IST window, retry cap,</text>
  <text x="96" y="990" class="boxbody">campaign + global concurrency</text>
  <rect x="378" y="916" width="285" height="92" rx="13" fill="#f8f9fe" stroke="#e5e9f6"/>
  <text x="396" y="944" class="label">02  BUFFER</text>
  <text x="396" y="969" class="boxbody">Transactional outbox now;</text>
  <text x="396" y="990" class="boxbody">SQS consumers planned</text>
  <rect x="678" y="916" width="285" height="92" rx="13" fill="#f8f9fe" stroke="#e5e9f6"/>
  <text x="696" y="944" class="label">03  SCALE OUT</text>
  <text x="696" y="969" class="boxbody">More workers and media pods;</text>
  <text x="696" y="990" class="boxbody">reserve carrier + AI capacity</text>
  <rect x="978" y="916" width="344" height="92" rx="13" fill="#f8f9fe" stroke="#e5e9f6"/>
  <text x="996" y="944" class="label">04  OBSERVE + STOP</text>
  <text x="996" y="969" class="boxbody">Queue age, latency, cost, errors;</text>
  <text x="996" y="990" class="boxbody">pause/stop campaigns immediately</text>
  <text x="78" y="1037" class="small">Capacity is a design objective, not a measured result. Provider limits, spend gates, autoscaling and failure tests remain production gates.</text>
</svg>
