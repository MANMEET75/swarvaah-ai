# Temporary, one-call local phone pilot. The dial worker is opt-in via `--profile dial`.
name: swarvaah-pilot
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swarvaah
      POSTGRES_USER: swarvaah
      POSTGRES_PASSWORD: local-only-pilot-password
    volumes: ["pilot_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarvaah"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    env_file: .env.pilot
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:local-only-pilot-password@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
      SSL_CERT_FILE: /etc/ssl/certs/swarvaah-pilot-bundle.pem
    volumes:
      - ./.pilot/ca-bundle.pem:/etc/ssl/certs/swarvaah-pilot-bundle.pem:ro
      - ./backend/app:/app/app:ro
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  gateway:
    build: ./backend
    command: ["uvicorn", "app.voice_agent:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    env_file: .env.pilot
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:local-only-pilot-password@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
      SSL_CERT_FILE: /etc/ssl/certs/swarvaah-pilot-bundle.pem
    volumes:
      - ./.pilot/ca-bundle.pem:/etc/ssl/certs/swarvaah-pilot-bundle.pem:ro
      - ./backend/app:/app/app:ro
    depends_on:
      db: {condition: service_healthy}
  edge:
    image: caddy:2-alpine
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["./infra/pilot/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [api, gateway]
  web:
    build: ./web
    env_file: .env.pilot
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
  worker:
    profiles: ["dial"]
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env.pilot
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:local-only-pilot-password@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
      SSL_CERT_FILE: /etc/ssl/certs/swarvaah-pilot-bundle.pem
    volumes:
      - ./.pilot/ca-bundle.pem:/etc/ssl/certs/swarvaah-pilot-bundle.pem:ro
      - ./backend/app:/app/app:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pilot_postgres:
