[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarvaah-ai"
version = "0.1.0"
description = "India-first AI calling control plane"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
voice = ["pipecat-ai[websocket,sarvam]>=1.8,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
