# Single-host, one-number media pilot. Deploy only on an approved public host.
name: swarvaah-gateway
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swarvaah
      POSTGRES_USER: swarvaah
      POSTGRES_PASSWORD: ${SWARVAAH_DB_PASSWORD:?Set SWARVAAH_DB_PASSWORD}
    volumes: ["gateway_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarvaah"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    env_file: .env.gateway
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:${SWARVAAH_DB_PASSWORD}@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  gateway:
    build: ./backend
    command: ["uvicorn", "app.voice_agent:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    env_file: .env.gateway
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:${SWARVAAH_DB_PASSWORD}@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_caddy_data:/data
      - gateway_caddy_config:/config
    depends_on: [api, gateway]
    restart: unless-stopped
  worker:
    profiles: ["dial"]
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env.gateway
    environment:
      DATABASE_URL: postgresql+psycopg://swarvaah:${SWARVAAH_DB_PASSWORD}@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  gateway_postgres:
  gateway_caddy_data:
  gateway_caddy_config:
