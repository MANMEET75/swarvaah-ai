services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swarvaah
      POSTGRES_USER: swarvaah
      POSTGRES_PASSWORD: local-only-password
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarvaah"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      SWARVAAH_MODE: demo
      CALL_MODE: simulation
      DATABASE_URL: postgresql+psycopg://swarvaah:local-only-password@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      CONVERSATION_MODE: ${CONVERSATION_MODE:-deterministic}
      SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b-conversations}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      SWARVAAH_MODE: demo
      CALL_MODE: simulation
      DATABASE_URL: postgresql+psycopg://swarvaah:local-only-password@db:5432/swarvaah
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: ./web
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
